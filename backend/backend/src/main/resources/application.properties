# App name
spring.application.name=mentixora-backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/mentixora
spring.datasource.username=postgres
spring.datasource.password=mentixora123
spring.datasource.driver-class-name=org.postgresql.Driver

